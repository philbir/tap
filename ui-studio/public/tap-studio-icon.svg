<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Tap Studio icon</title>
  <desc id="desc">A simple tap-shaped mark with a flowing request stream.</desc>
  <defs>
    <linearGradient id="bg" x1="8" x2="56" y1="6" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C41FF"/>
      <stop offset="1" stop-color="#3E15A8"/>
    </linearGradient>
    <linearGradient id="stream" x1="12" x2="52" y1="43" y2="43" gradientUnits="userSpaceOnUse">
