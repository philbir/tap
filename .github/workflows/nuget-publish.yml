name: Publish NuGet packages

on:
  push:
    # Plain SemVer tags, no `v` prefix — `0.1.0`, `0.1.0-alpha.4`, etc.
    # Matches the Docker + pages workflows.
    tags: ["[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version override (e.g. 0.1.0)"
        required: false
      dry_run:
        description: "Pack only, don't push"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      # Tap.Cli + Tap.Server bundle the Vite-built UI into wwwroot/ via the
      # BuildTapUi MSBuild target. The target shells out to `yarn build`, so
      # Node + Corepack must be on PATH at pack time.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      # Dispatch inputs and step outputs go through `env:`, never straight into
      # the script body — a `${{ }}` splice is textual, so a crafted version
      # string would run as shell in the job that holds NUGET_API_KEY.
      - name: Resolve version
        id: ver
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            echo "version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          else
            # Tags are plain SemVer (no `v` prefix) — `0.1.0`, `0.1.0-alpha.4`.
            v="${GITHUB_REF#refs/tags/}"
            echo "version=$v" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          dotnet pack Tap.slnx \
            -c Release \
            -p:Version="$VERSION" \
            -o artifacts

      - name: List artifacts
        run: ls -la artifacts/

      - name: Push to NuGet.org
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          dotnet nuget push 'artifacts/*.nupkg' \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY" \
            --skip-duplicate

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nupkgs
          path: artifacts/*.nupkg
          retention-days: 14
