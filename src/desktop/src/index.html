<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tap Studio</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fafbfc;
        --fg: #3a4654;
        --muted: #8a94a1;
        --line: #e3e7eb;
        --accent: #2c7be5;
        --danger: #c2410c;
        --panel: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #16191d;
          --fg: #dbe2ea;
          --muted: #8a94a1;
          --line: #2b3138;
          --accent: #5b9ef4;
          --danger: #f0834f;
          --panel: #1d2126;
        }
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        display: grid;
        place-items: center;
        min-height: 100vh;
        user-select: none;
        -webkit-user-select: none;
      }
      .wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        padding: 32px 24px;
        max-width: 720px;
        width: 100%;
        box-sizing: border-box;
      }
      .spinner {
        width: 36px;
        height: 36px;
        border: 3px solid var(--line);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: rotate 0.9s linear infinite;
      }
      @keyframes rotate {
        to {
          transform: rotate(360deg);
        }
      }
      .label {
        letter-spacing: 0.02em;
      }
      .sublabel {
        color: var(--muted);
        font-size: 12px;
        text-align: center;
        min-height: 16px;
      }
      /* Failure view — hidden until the shell reports it gave up. */
      .failed .spinner,
      .failed .elapsed {
        display: none;
      }
      .failed .label {
        color: var(--danger);
        font-weight: 600;
        font-size: 15px;
      }
      .hint,
      .logpath,
      .actions,
      .logbox {
        display: none;
        width: 100%;
      }
      .failed .hint,
      .failed .logpath,
      .failed .actions {
        display: block;
      }
      .failed .sublabel {
        text-align: left;
        font-size: 13px;
        color: var(--fg);
      }
      .hint {
        color: var(--muted);
        font-size: 12.5px;
        line-height: 1.5;
      }
      .logpath {
        color: var(--muted);
        font-size: 11.5px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        word-break: break-all;
        user-select: text;
        -webkit-user-select: text;
      }
      .actions {
        display: none;
        gap: 8px;
        justify-content: flex-start;
      }
      .failed .actions {
        display: flex;
      }
      button {
        font: inherit;
        font-size: 13px;
        padding: 6px 12px;
        border-radius: 6px;
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--fg);
        cursor: pointer;
      }
      button:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      button.primary:hover {
        color: #fff;
        opacity: 0.9;
      }
      .logbox {
        margin: 0;
        max-height: 40vh;
        overflow: auto;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 10px 12px;
        font: 11.5px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
        white-space: pre-wrap;
        word-break: break-word;
        color: var(--muted);
        user-select: text;
        -webkit-user-select: text;
      }
      .logbox.open {
        display: block;
      }
      .elapsed {
        color: var(--muted);
        font-size: 11px;
        font-variant-numeric: tabular-nums;
      }
    </style>
    <script src="splash.js" defer></script>
  </head>
  <body>
    <div class="wrap" id="wrap">
      <div class="spinner"></div>
      <div class="label" id="phase">Starting Tap Studio…</div>
      <div class="sublabel" id="detail"></div>
      <div class="elapsed" id="elapsed"></div>
      <div class="hint" id="hint"></div>
      <div class="logpath" id="logpath"></div>
      <div class="actions">
        <button class="primary" id="retry" type="button">Try again</button>
        <button id="toggle-log" type="button">Show details</button>
        <button id="open-log" type="button">Open log folder</button>
        <button id="copy" type="button">Copy diagnostics</button>
      </div>
      <pre class="logbox" id="logbox"></pre>
    </div>
  </body>
</html>
