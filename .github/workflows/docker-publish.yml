name: Publish Docker images

on:
  push:
    # Plain SemVer tags, no `v` prefix — `0.1.0`, `0.1.0-alpha.4`, etc.
    tags: ["[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  # Two images, two platforms each: ghcr.io/<repo> is Tap Tunnels' inspector and
  # ghcr.io/<repo>-studio is Tap Studio. Both are built per-platform here, pushed by
  # digest, and stitched into one manifest list per image by the merge job.
  build:
    strategy:
      fail-fast: false
      matrix:
        image:
          - key: tunnels
            suffix: ""
            product: Tap Tunnels
            description: Local HTTP tunnels with inspection built in
            url: https://philbir.github.io/tap/#/tunnels
            icon: /app/wwwroot/tap-tunnels-icon.svg
            file: src/backend/Tap.Server/Dockerfile
          - key: studio
            suffix: "-studio"
            product: Tap Studio
            description: The HTTP request and auth credential crafter
            url: https://philbir.github.io/tap/#/studio
            icon: /app/wwwroot/tap-studio-icon.svg
            file: src/backend/Tap.Studio/Dockerfile
        platform:
          - linux/amd64
          - linux/arm64
        # Matches on `platform`, so each row adds its runner to both image builds.
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    name: ${{ matrix.image.key }} ${{ matrix.platform }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ${{ github.repository }}${{ matrix.image.suffix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify published brand assets
        run: bash scripts/verify-brand-assets.sh

      - name: Prepare platform pair
        id: prep
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          echo "pair=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.title=${{ matrix.image.product }}
            org.opencontainers.image.description=${{ matrix.image.description }}
            org.opencontainers.image.url=${{ matrix.image.url }}
            io.tap.product=${{ matrix.image.product }}
            io.tap.product.icon=${{ matrix.image.icon }}

      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.image.file }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image.key }}-${{ steps.prep.outputs.pair }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.key }}-${{ steps.prep.outputs.pair }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      # The image key is part of the artifact name so the merge job can select one
      # image's digests: `digest-tunnels-*` must not also match Studio's.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.image.key }}-${{ steps.prep.outputs.pair }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        image:
          - key: tunnels
            suffix: ""
            product: Tap Tunnels
            description: Local HTTP tunnels with inspection built in
            icon: /app/wwwroot/tap-tunnels-icon.svg
          - key: studio
            suffix: "-studio"
            product: Tap Studio
            description: The HTTP request and auth credential crafter
            icon: /app/wwwroot/tap-studio-icon.svg
    name: merge ${{ matrix.image.key }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ${{ github.repository }}${{ matrix.image.suffix }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digest-${{ matrix.image.key }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Tag-only workflow: emit the version tags, plus `latest` for
          # stable releases (any tag without a pre-release suffix).
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        env:
          PRODUCT: ${{ matrix.image.product }}
          DESCRIPTION: ${{ matrix.image.description }}
          ICON: ${{ matrix.image.icon }}
        run: |
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.title=${PRODUCT}" \
            --annotation "index:org.opencontainers.image.description=${DESCRIPTION}" \
            --annotation "index:io.tap.product=${PRODUCT}" \
            --annotation "index:io.tap.product.icon=${ICON}" \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${REGISTRY}/${IMAGE_NAME}@sha256:%s " *)

      - name: Inspect image
        env:
          IMAGE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker buildx imagetools inspect "${REGISTRY}/${IMAGE_NAME}:${IMAGE_VERSION}"
