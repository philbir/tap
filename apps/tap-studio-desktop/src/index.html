<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tap Studio</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        background: #fafbfc;
        color: #3a4654;
        font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        display: grid;
        place-items: center;
        height: 100vh;
        user-select: none;
        -webkit-user-select: none;
      }
      .wrap { display: flex; flex-direction: column; align-items: center; gap: 16px; }
      .spinner {
        width: 36px; height: 36px;
        border: 3px solid #e3e7eb;
        border-top-color: #2c7be5;
        border-radius: 50%;
        animation: rotate 0.9s linear infinite;
      }
      @keyframes rotate { to { transform: rotate(360deg); } }
      .label { letter-spacing: 0.02em; }
      .sublabel { color: #8a94a1; font-size: 12px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="spinner"></div>
      <div class="label">Starting Tap Studio…</div>
      <div class="sublabel" id="status">Spawning sidecar</div>
    </div>
  </body>
</html>
