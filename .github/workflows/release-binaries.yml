name: Release binaries

on:
  push:
    # Plain SemVer tags, no `v` prefix — `0.1.0`, `0.1.0-alpha.4`, etc.
    # Matches the docker, nuget, and pages workflows.
    tags: ["[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version override (e.g. 0.1.0)"
        required: false
      dry_run:
        description: "Publish + archive only, don't create a GitHub Release"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-latest
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
          # Both macOS RIDs build on macos-14 (arm64 host) — .NET cross-publishes
          # for osx-x64 from an arm host. macos-13 (Intel) is being retired by GitHub.
          - rid: osx-x64
            runner: macos-14
          - rid: osx-arm64
            runner: macos-14
          # Windows is intentionally not built as a self-contained binary: the
          # publish step hung indefinitely on windows-latest. Windows users
          # install via `dotnet tool install -g Tap` (see install.ps1).
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      # Stop corepack from prompting for stdin confirmation on first download —
      # the Windows runner was hanging here for 6h.
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify published brand assets
        run: bash scripts/verify-brand-assets.sh

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      # Tap.Cli + Tap.Server bundle the Vite-built UI into wwwroot/ via the
      # BuildTapUi MSBuild target. The target shells out to `yarn build`, so
      # Node + Corepack must be on PATH at publish time.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Enable Corepack
        shell: bash
        run: |
          corepack enable
          # Pre-fetch the pinned yarn version so the MSBuild Exec target
          # never has to download mid-build (avoids hangs on Windows).
          corepack prepare yarn@4.9.1 --activate

      # Dispatch inputs and step outputs go through `env:`, never straight into
      # the script body — a `${{ }}` splice is textual, so a crafted version
      # string would execute as shell inside the release pipeline.
      - name: Resolve version
        id: ver
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            v="$INPUT_VERSION"
          else
            v="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Publish self-contained single-file
        shell: bash
        env:
          RID: ${{ matrix.rid }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          dotnet publish src/backend/Tap.Cli/Tap.Cli.csproj \
            -c Release \
            -r "$RID" \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            -p:Version="$VERSION" \
            -o "publish/$RID"

      - name: Stage archive contents
        shell: bash
        env:
          RID: ${{ matrix.rid }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          version="$VERSION"
          rid="$RID"
          name="tap-${version}-${rid}"
          mkdir -p "stage/${name}"
          cp -R "publish/${rid}/." "stage/${name}/"
          # Keep the release archive self-describing outside the browser UI.
          cp assets/tap-tunnels-icon.svg "stage/${name}/tap-tunnels-icon.svg"
          cp assets/tap-tunnels-icon-128.png "stage/${name}/tap-tunnels-icon.png"
          # Drop debug symbols if any slipped through
          find "stage/${name}" -name "*.pdb" -delete || true
          ls -la "stage/${name}"

      - name: Create archive (tar.gz)
        shell: bash
        env:
          RID: ${{ matrix.rid }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          version="$VERSION"
          rid="$RID"
          name="tap-${version}-${rid}"
          tar -C stage -czf "${name}.tar.gz" "${name}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${name}.tar.gz" | awk '{print $1}' > "${name}.tar.gz.sha256"
          else
            shasum -a 256 "${name}.tar.gz" | awk '{print $1}' > "${name}.tar.gz.sha256"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.rid }}
          path: |
            tap-*.tar.gz
            tap-*.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # Need write to attach release assets.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: binary-*
          merge-multiple: true

      - name: Resolve version
        id: ver
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            v="$INPUT_VERSION"
          else
            v="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Generate SHA256SUMS
        working-directory: artifacts
        run: |
          ls -la
          sha256sum tap-*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: Tap Tunnels ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          # Any SemVer pre-release tag carries a `-` (0.5.0-beta.2). Without
          # this, whichever of this job and desktop.yml creates the release
          # first decides the flag — and this one would publish a beta as
          # "Latest". desktop.yml already gates on the same expression.
          prerelease: ${{ contains(steps.ver.outputs.version, '-') }}
          files: |
            artifacts/tap-*.tar.gz
            artifacts/SHA256SUMS
